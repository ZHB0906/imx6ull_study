# ============================================================================
# /etc/ota.conf —— 板子侧 OTA 客户端配置
#
# ★ 多 URL：**按顺序依次尝试** ✓
#   第一优先放局域网服务器（快 ✓ 实测 1.1MB/s），后面放公网（兜底 ✓ 实测 0.25MB/s）
#   板子在 NAT 后面 ✗ → 只能"主动拉" ✓ 所以这里配的是**板子能访问到的**地址 ✓
#
# 每一行是一个"OTA 根目录"：客户端会去取
#     <URL>/update.manifest      清单（含版本/size/sha256/文件名 ✓）
#     <URL>/update.manifest.sig  清单签名（真实性 ✓ 板子没有 TLS ✗ 靠它 ✓）
#     <URL>/<file>               镜像本体（支持断点续传 ✓）
# ============================================================================

URLS="
http://10.23.61.142:8899/ota
"

# 公网源示例（取消注释并替换成你自己的 ✓）：
#   · 内网穿透（frp / cloudflared / ngrok）：把上面那个局域网地址暴露成公网 ✓
#   · 对象存储（公共读 bucket ✓）
#   · 自建 VPS（nginx 静态目录 ✓）
# URLS="
# http://10.23.61.142:8899/ota
# http://<你的公网地址>/ota
# "

# 验签公钥（openssl 用 .pem ✓；精简验签器用 .hex ✓）
OTA_PUBKEY=/etc/ota-pub.pem

# ★★ 仅实验室：允许"跳过验签"（默认**关闭** ✓✓ 生产环境**绝不可开** ✗✗）
#    打开它只会在没有验签工具时放行，并在日志里留下醒目警告 ✓
#    正规做法：给板子放一个 ed25519-verify（或 rebuild rootfs 带 openssl ✓）
# OTA_ALLOW_UNSIGNED=1
